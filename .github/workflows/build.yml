name: Build and Release APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'exam.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Point the app at this repo's exam.json
        run: sed -i "s#OWNER/REPO/BRANCH#${{ github.repository }}/${{ github.ref_name }}#" app/src/main/res/values/config.xml

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JEE-Countdown.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: JEE Countdown v1.0.${{ github.run_number }}
          body: |
            Install JEE-Countdown.apk, then add the "JEE Countdown" and "JEE Updates" widgets from your home screen widget list.
          files: JEE-Countdown.apk
